name: Build Flutter
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbita_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Создать платформенные папки
        run: flutter create --platforms=android,ios --project-name orbita --org az.orbita .
      - name: Разрешить интернет и http (бета)
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          grep -n "INTERNET\|cleartext" android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: orbita-flutter-apk
          path: orbita_flutter/build/app/outputs/flutter-apk/app-release.apk
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: orbita_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,ios --project-name orbita --org az.orbita .
      - name: Разрешить http (бета)
        run: /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" ios/Runner/Info.plist
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
