name: Build Flutter
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbita_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Создать папку android
        run: flutter create --platforms=android --project-name orbita --org az.orbita .
      - name: Название Orbit
        run: sed -i 's|android:label="[^"]*"|android:label="Orbit"|' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - name: Иконка приложения
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-mockup-apk
          path: orbita_flutter/build/app/outputs/flutter-apk/app-release.apk
